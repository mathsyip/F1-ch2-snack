<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>有向數貪食蛇</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: none; /* Prevent scroll on mobile while swiping/pressing */
            background-color: #f0fdf4;
            color: #334155;
        }
        
        #game-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            margin: 0 auto;
            background-color: #ffffff;
            border: 6px solid #86efac;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .btn {
            transition: all 0.1s ease;
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* D-Pad styles */
        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }
        .d-btn {
            background-color: #ffffff;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #475569;
            border: 2px solid #e2e8f0;
            user-select: none;
            box-shadow: 0 4px 0 #cbd5e1;
        }
        .d-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #cbd5e1;
        }
        .up { grid-column: 2; grid-row: 1; }
        .left { grid-column: 1; grid-row: 2; }
        .right { grid-column: 3; grid-row: 2; }
        .down { grid-column: 2; grid-row: 3; }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(2px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-4 px-2">

    <!-- Header / Stats -->
    <div class="w-full max-w-[500px] mb-4">
        <h1 class="text-3xl font-black text-center text-green-600 mb-2 tracking-wider">有向數貪食蛇</h1>
        
        <div class="flex justify-between items-center bg-white p-3 rounded-xl border-2 border-green-200 shadow-sm">
            <div class="text-lg font-bold text-slate-600">
                分數: <span id="scoreDisplay" class="text-green-500 text-2xl">0</span>
            </div>
            <div id="activeBuffs" class="flex gap-2 text-sm font-bold">
                <!-- Buff indicators will go here -->
            </div>
            <div class="text-lg font-bold text-slate-600">
                長度: <span id="lengthDisplay" class="text-blue-500 text-2xl">3</span>
            </div>
        </div>

        <!-- Question Display -->
        <div class="mt-4 bg-yellow-50 border-4 border-yellow-300 rounded-xl p-4 text-center shadow-md transform transition-transform" id="questionBox">
            <p class="text-sm text-yellow-700 font-bold mb-1">計算此題並吃掉正確答案：</p>
            <div id="questionDisplay" class="text-4xl font-black text-yellow-900 tracking-widest drop-shadow-sm">
                準備開始
            </div>
        </div>
    </div>

    <!-- Game Area -->
    <div id="game-container">
        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <!-- Start Menu -->
        <div id="startMenu" class="overlay">
            <h2 class="text-4xl font-black text-green-600 mb-6 drop-shadow-sm">選擇難度</h2>
            <div class="flex flex-col gap-4 w-3/4 max-w-[250px]">
                <button onclick="startGame('easy')" class="btn bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-full text-xl shadow-[0_4px_0_rgb(21,128,61)] border-2 border-green-300">容易 (加減)</button>
                <button onclick="startGame('medium')" class="btn bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3 px-6 rounded-full text-xl shadow-[0_4px_0_rgb(161,98,7)] border-2 border-yellow-300">中等 (加減乘)</button>
                <button onclick="startGame('hard')" class="btn bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-full text-xl shadow-[0_4px_0_rgb(153,27,27)] border-2 border-red-300">困難 (四則運算)</button>
            </div>
            <div class="mt-8 text-sm text-slate-600 text-center px-4 bg-white/80 p-3 rounded-lg border border-slate-200">
                <p>💡 吃到錯誤答案會扣分並縮短長度</p>
                <p class="mt-2"><span class="text-purple-500 font-bold">●</span> 穿牆藥水 &nbsp; <span class="text-blue-500 font-bold">●</span> 減速藥水</p>
            </div>
        </div>

        <!-- Game Over Menu -->
        <div id="gameOverMenu" class="overlay hidden">
            <h2 class="text-5xl font-black text-red-500 mb-2 drop-shadow-sm">遊戲結束</h2>
            <p class="text-xl text-slate-600 mb-6 font-bold" id="gameOverReason">你撞牆了！</p>
            <div class="bg-white p-6 rounded-xl border-4 border-slate-200 mb-6 text-center shadow-sm">
                <p class="text-slate-500 mb-1 font-bold">最終分數</p>
                <p class="text-5xl font-black text-green-500" id="finalScore">0</p>
            </div>
            <button onclick="showMenu()" class="btn bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full text-xl shadow-[0_4px_0_rgb(37,99,235)] border-2 border-blue-300">返回主選單</button>
        </div>
    </div>

    <!-- Mobile Controls -->
    <div class="mt-6 sm:hidden">
        <div class="d-pad">
            <div class="d-btn up" onpointerdown="handleInput('ArrowUp')">▲</div>
            <div class="d-btn left" onpointerdown="handleInput('ArrowLeft')">◀</div>
            <div class="d-btn right" onpointerdown="handleInput('ArrowRight')">▶</div>
            <div class="d-btn down" onpointerdown="handleInput('ArrowDown')">▼</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const scoreDisplay = document.getElementById('scoreDisplay');
        const lengthDisplay = document.getElementById('lengthDisplay');
        const questionDisplay = document.getElementById('questionDisplay');
        const activeBuffs = document.getElementById('activeBuffs');
        const startMenu = document.getElementById('startMenu');
        const gameOverMenu = document.getElementById('gameOverMenu');
        const finalScoreDisplay = document.getElementById('finalScore');
        const gameOverReason = document.getElementById('gameOverReason');
        const questionBox = document.getElementById('questionBox');

        // Game Constants
        const GRID_SIZE = 12; 
        const TILE_COUNT = 12; 
        const TILE_SIZE = canvas.width / TILE_COUNT; 

        // Game State
        let snake = [];
        let dx = 0;
        let dy = 0;
        let score = 0;
        let difficulty = 'easy';
        let gameLoopTimeout;
        let isPlaying = false;
        
        // Math State
        let currentAns = 0;
        let foods = []; // Array of {x, y, value, isCorrect}
        
        // Items State
        let items = []; // Array of {x, y, type: 'ghost' | 'slow'}
        let buffs = {
            ghost: { active: false, timer: 0 },
            slow: { active: false, timer: 0 }
        };

        // Utility: Random Integer
        function rand(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        // --- Math Generation Logic ---
        function generateMathQuestion() {
            let num1, num2, ans, operator, questionStr;
            let ops = [];
            
            if (difficulty === 'easy') ops = ['+', '-'];
            else if (difficulty === 'medium') ops = ['+', '-', '*'];
            else ops = ['+', '-', '*', '/'];

            operator = ops[rand(0, ops.length - 1)];

            if (operator === '+') {
                let limit = difficulty === 'easy' ? 10 : 25;
                num1 = rand(-limit, limit);
                num2 = rand(-limit, limit);
                ans = num1 + num2;
                questionStr = `${num1} + ${num2 < 0 ? `(${num2})` : num2}`;
            } 
            else if (operator === '-') {
                let limit = difficulty === 'easy' ? 10 : 20;
                num1 = rand(-limit, limit);
                num2 = rand(-limit, limit);
                ans = num1 - num2;
                questionStr = `${num1} - ${num2 < 0 ? `(${num2})` : num2}`;
            }
            else if (operator === '*') {
                let limit = difficulty === 'medium' ? 6 : 12;
                num1 = rand(-limit, limit);
                num2 = rand(-limit, limit);
                ans = num1 * num2;
                questionStr = `${num1} × ${num2 < 0 ? `(${num2})` : num2}`;
            }
            else if (operator === '/') {
                // Ensure clean division
                let limit = 12;
                ans = rand(-limit, limit);
                num2 = rand(-limit, limit);
                if (num2 === 0) num2 = 1; // Prevent divide by zero
                num1 = ans * num2;
                questionStr = `${num1} ÷ ${num2 < 0 ? `(${num2})` : num2}`;
            }

            currentAns = ans;
            questionDisplay.textContent = questionStr + " = ?";
            
            // Highlight animation for new question
            questionBox.classList.add('scale-105', 'bg-yellow-200');
            setTimeout(() => {
                questionBox.classList.remove('scale-105', 'bg-yellow-200');
            }, 300);

            spawnFoods();
        }

        function getEmptyPosition() {
            let x, y, isOccupied;
            do {
                isOccupied = false;
                x = rand(0, TILE_COUNT - 1);
                y = rand(0, TILE_COUNT - 1);
                
                // Check snake
                for (let s of snake) {
                    if (s.x === x && s.y === y) isOccupied = true;
                }
                // Check foods
                for (let f of foods) {
                    if (f.x === x && f.y === y) isOccupied = true;
                }
                // Check items
                for (let i of items) {
                    if (i.x === x && i.y === y) isOccupied = true;
                }
            } while (isOccupied);
            return {x, y};
        }

        function spawnFoods() {
            foods = [];
            const foodCount = difficulty === 'easy' ? 3 : (difficulty === 'medium' ? 4 : 5);
            
            // Generate wrong answers
            let options = [currentAns];
            while (options.length < foodCount) {
                // Generate a believable wrong answer
                let variance = rand(-10, 10);
                if (variance === 0) variance = 1;
                let wrong = currentAns + variance;
                
                // Sometimes just flip the sign (common mistake)
                if (Math.random() > 0.7 && currentAns !== 0) {
                    wrong = -currentAns;
                }

                if (!options.includes(wrong)) {
                    options.push(wrong);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            // Place on grid
            for (let i = 0; i < foodCount; i++) {
                let pos = getEmptyPosition();
                foods.push({
                    x: pos.x,
                    y: pos.y,
                    value: options[i],
                    isCorrect: options[i] === currentAns
                });
            }

            // Chance to spawn item
            if (Math.random() < 0.3 && items.length === 0) {
                spawnItem();
            }
        }

        function spawnItem() {
            let pos = getEmptyPosition();
            let type = Math.random() > 0.5 ? 'ghost' : 'slow';
            items.push({ x: pos.x, y: pos.y, type: type });
        }

        // --- Game Logic ---
        function showMenu() {
            gameOverMenu.classList.add('hidden');
            startMenu.classList.remove('hidden');
            isPlaying = false;
        }

        function startGame(diff) {
            difficulty = diff;
            startMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            
            // Reset state
            snake = [
                {x: 5, y: 5},
                {x: 5, y: 6},
                {x: 5, y: 7}
            ];
            dx = 0;
            dy = -1; // Moving up initially
            score = 0;
            items = [];
            buffs.ghost.active = false;
            buffs.slow.active = false;
            
            updateStats();
            generateMathQuestion();
            
            isPlaying = true;
            loop();
        }

        function gameOver(reason) {
            isPlaying = false;
            clearTimeout(gameLoopTimeout);
            
            gameOverReason.textContent = reason;
            finalScoreDisplay.textContent = score;
            gameOverMenu.classList.remove('hidden');
        }

        function updateStats() {
            scoreDisplay.textContent = score;
            lengthDisplay.textContent = snake.length;
            
            // Update Buff UI
            activeBuffs.innerHTML = '';
            if (buffs.ghost.active) {
                activeBuffs.innerHTML += `<span class="bg-purple-600 text-white px-2 py-1 rounded">穿牆 ${Math.ceil(buffs.ghost.timer/1000)}s</span>`;
            }
            if (buffs.slow.active) {
                activeBuffs.innerHTML += `<span class="bg-blue-600 text-white px-2 py-1 rounded">減速 ${Math.ceil(buffs.slow.timer/1000)}s</span>`;
            }
        }

        function applyBuff(type) {
            buffs[type].active = true;
            buffs[type].timer = 10000; // 10 seconds
        }

        function loop() {
            if (!isPlaying) return;

            // 所有難度皆固定為容易的速度 (180ms)
            let baseSpeed = 180;
            if (buffs.slow.active) baseSpeed += 80; // 吃減速藥水時再變慢
            
            // Update logic
            update();
            draw();

            if (isPlaying) {
                gameLoopTimeout = setTimeout(loop, baseSpeed);
            }
        }

        function update() {
            // Calculate next head position
            let headX = snake[0].x + dx;
            let headY = snake[0].y + dy;

            // 固定時間步長為 180ms
            const timeStep = 180;
            ['ghost', 'slow'].forEach(type => {
                if (buffs[type].active) {
                    buffs[type].timer -= timeStep;
                    if (buffs[type].timer <= 0) {
                        buffs[type].active = false;
                    }
                }
            });

            // Wall Collision
            if (headX < 0 || headX >= TILE_COUNT || headY < 0 || headY >= TILE_COUNT) {
                if (buffs.ghost.active) {
                    // Wrap around
                    if (headX < 0) headX = TILE_COUNT - 1;
                    if (headX >= TILE_COUNT) headX = 0;
                    if (headY < 0) headY = TILE_COUNT - 1;
                    if (headY >= TILE_COUNT) headY = 0;
                } else {
                    return gameOver("撞牆了！");
                }
            }

            // Self Collision
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === headX && snake[i].y === headY) {
                    return gameOver("咬到自己了！");
                }
            }

            // Create new head
            let newHead = {x: headX, y: headY};
            snake.unshift(newHead); // Add to beginning

            let ateFood = false;

            // Food Collision
            for (let i = 0; i < foods.length; i++) {
                if (headX === foods[i].x && headY === foods[i].y) {
                    ateFood = true;
                    if (foods[i].isCorrect) {
                        // Correct Answer!
                        score += (difficulty === 'easy' ? 10 : (difficulty === 'medium' ? 15 : 20));
                        // Snake grows (we don't pop the tail)
                        generateMathQuestion();
                    } else {
                        // Wrong Answer!
                        score = Math.max(0, score - 5);
                        // Penalty: pop tail twice to shrink by 1 net
                        snake.pop(); // Remove growth
                        if (snake.length > 1) snake.pop(); // Actual shrink
                        
                        // Flash red
                        document.getElementById('game-container').classList.add('border-red-500');
                        setTimeout(() => document.getElementById('game-container').classList.remove('border-red-500'), 200);

                        if (snake.length === 0) {
                            return gameOver("吃到錯誤答案，長度歸零！");
                        }
                        // Remove eaten wrong food
                        foods.splice(i, 1);
                    }
                    break;
                }
            }

            // Item Collision
            for (let i = 0; i < items.length; i++) {
                if (headX === items[i].x && headY === items[i].y) {
                    applyBuff(items[i].type);
                    items.splice(i, 1); // Remove item
                    score += 5;
                    break;
                }
            }

            // If didn't eat food, remove tail to maintain length
            if (!ateFood) {
                snake.pop();
            }

            updateStats();
        }

        // --- Drawing Logic ---
        function drawCell(x, y, radius, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.roundRect(x * TILE_SIZE + 1, y * TILE_SIZE + 1, TILE_SIZE - 2, TILE_SIZE - 2, radius);
            ctx.fill();
        }

        function drawTextCell(x, y, text, bgColor, textColor) {
            // Draw Circle Background
            ctx.fillStyle = bgColor;
            ctx.beginPath();
            ctx.arc(x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2, TILE_SIZE/2, 0, Math.PI * 2);
            ctx.fill();
            
            // 根據數字長度動態調整字體大小，避免雙位數負數（如 -15）超出版面
            let textStr = text.toString();
            let fontSize = TILE_SIZE * 0.7; // 單個數字的最大尺寸
            if (textStr.length > 2) {
                fontSize = TILE_SIZE * 0.55; 
            } else if (textStr.length > 1) {
                fontSize = TILE_SIZE * 0.65;
            }

            // Draw Text
            ctx.fillStyle = textColor;
            ctx.font = `900 ${fontSize}px Nunito`;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x * TILE_SIZE + TILE_SIZE/2, y * TILE_SIZE + TILE_SIZE/2 + 2);
        }

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#ffffff'; // Match container bg
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid lines
            ctx.strokeStyle = '#f1f5f9';
            ctx.lineWidth = 1;
            for(let i=0; i<=TILE_COUNT; i++) {
                ctx.beginPath(); ctx.moveTo(i*TILE_SIZE, 0); ctx.lineTo(i*TILE_SIZE, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*TILE_SIZE); ctx.lineTo(canvas.width, i*TILE_SIZE); ctx.stroke();
            }

            // Draw Items
            items.forEach(item => {
                let color = item.type === 'ghost' ? '#a855f7' : '#3b82f6'; // Purple : Blue
                drawCell(item.x, item.y, 15, color);
                // Icon (simple text)
                ctx.fillStyle = 'white';
                ctx.font = `bold ${TILE_SIZE * 0.65}px Arial`;
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(item.type === 'ghost' ? '👻' : '🐢', item.x * TILE_SIZE + TILE_SIZE/2, item.y * TILE_SIZE + TILE_SIZE/2 + 2);
            });

            // Draw Foods (Answers)
            foods.forEach(food => {
                drawTextCell(food.x, food.y, food.value, '#ef4444', '#ffffff');
            });

            // Draw Snake
            snake.forEach((segment, index) => {
                let isHead = index === 0;
                let color;
                
                if (buffs.ghost.active) {
                    color = isHead ? 'rgba(167, 139, 250, 0.9)' : 'rgba(139, 92, 246, 0.6)'; // Purple semi-transparent
                } else {
                    color = isHead ? '#34d399' : '#10b981'; // Green
                }

                drawCell(segment.x, segment.y, isHead ? 6 : 3, color);
                
                // Draw eyes on head
                if (isHead) {
                    ctx.fillStyle = '#064e3b';
                    let eyeOffset = TILE_SIZE / 4;
                    let eyeSize = TILE_SIZE / 6;
                    
                    if (dx === 1) { // Right
                        ctx.fillRect(segment.x*TILE_SIZE + TILE_SIZE/2 + eyeOffset/2, segment.y*TILE_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x*TILE_SIZE + TILE_SIZE/2 + eyeOffset/2, segment.y*TILE_SIZE + TILE_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (dx === -1) { // Left
                        ctx.fillRect(segment.x*TILE_SIZE + eyeOffset, segment.y*TILE_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x*TILE_SIZE + eyeOffset, segment.y*TILE_SIZE + TILE_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (dy === 1) { // Down
                        ctx.fillRect(segment.x*TILE_SIZE + eyeOffset, segment.y*TILE_SIZE + TILE_SIZE/2 + eyeOffset/2, eyeSize, eyeSize);
                        ctx.fillRect(segment.x*TILE_SIZE + TILE_SIZE - eyeOffset - eyeSize, segment.y*TILE_SIZE + TILE_SIZE/2 + eyeOffset/2, eyeSize, eyeSize);
                    } else if (dy === -1) { // Up
                        ctx.fillRect(segment.x*TILE_SIZE + eyeOffset, segment.y*TILE_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x*TILE_SIZE + TILE_SIZE - eyeOffset - eyeSize, segment.y*TILE_SIZE + eyeOffset, eyeSize, eyeSize);
                    }
                }
            });
        }

        // --- Controls ---
        function handleInput(key) {
            if (!isPlaying) return;

            if ((key === 'ArrowUp' || key === 'w' || key === 'W') && dy === 0) {
                dx = 0; dy = -1;
            } else if ((key === 'ArrowDown' || key === 's' || key === 'S') && dy === 0) {
                dx = 0; dy = 1;
            } else if ((key === 'ArrowLeft' || key === 'a' || key === 'A') && dx === 0) {
                dx = -1; dy = 0;
            } else if ((key === 'ArrowRight' || key === 'd' || key === 'D') && dx === 0) {
                dx = 1; dy = 0;
            }
        }

        window.addEventListener('keydown', (e) => {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            handleInput(e.key);
        });

        // Touch Swipe Handling
        let touchStartX = 0;
        let touchStartY = 0;

        window.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, {passive: true});

        window.addEventListener('touchend', (e) => {
            if (!isPlaying) return;
            
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;
            
            let diffX = touchEndX - touchStartX;
            let diffY = touchEndY - touchStartY;
            
            if (Math.abs(diffX) < 30 && Math.abs(diffY) < 30) return;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (diffX > 0) {
                    handleInput('ArrowRight');
                } else {
                    handleInput('ArrowLeft');
                }
            } else {
                if (diffY > 0) {
                    handleInput('ArrowDown');
                } else {
                    handleInput('ArrowUp');
                }
            }
        }, {passive: true});

        // Initialize UI
        showMenu();

    </script>
</body>
</html>
