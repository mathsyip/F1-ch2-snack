<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正負數乘法動態點擊探索平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
            user-select: none;
        }

        /* 點選卡牌動畫 */
        .card-item {
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
        }
        .card-item:hover {
            transform: translateY(-8px) scale(1.03);
        }
        .card-item:active {
            transform: scale(0.95);
        }
        
        /* 卡牌選中狀態 */
        .card-item.active-card {
            transform: translateY(-12px) scale(1.08);
            box-shadow: 0 12px 20px -3px rgba(59, 130, 246, 0.3), 0 4px 6px -2px rgba(59, 130, 246, 0.2);
        }

        .card-item.active-card.negative-style {
            box-shadow: 0 12px 20px -3px rgba(239, 68, 68, 0.3), 0 4px 6px -2px rgba(239, 68, 68, 0.2);
        }

        /* 數字跳動動畫 */
        @keyframes numberPop {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-effect {
            animation: numberPop 0.3s ease-out forwards;
        }

        /* 閃爍強調動畫 */
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
            50% { box-shadow: 0 0 25px rgba(34, 197, 94, 0.8); }
        }
        .positive-glow {
            animation: glowPulse 2s infinite;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <nav class="bg-indigo-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-3xl">🎴</span>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">正負數乘法 - 動態點擊探索平台</h1>
                    <p class="text-xs text-indigo-200 hidden sm:block">點擊牌卡即可即時進行正負數乘法運算演示</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="mode-demo-btn" onclick="switchMainTab('demo')" class="px-4 py-2 rounded-lg font-bold text-sm bg-white text-indigo-700 shadow hover:bg-indigo-50 transition">
                    📋 經典 4 大情境
                </button>
                <button id="mode-sandbox-btn" onclick="switchMainTab('sandbox')" class="px-4 py-2 rounded-lg font-bold text-sm bg-indigo-700 text-indigo-100 hover:bg-indigo-800 transition">
                    🧪 自由實驗室
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col gap-6">

        <!-- ===== 頁籤一：經典 4 大情境選單 ===== -->
        <div id="demo-tab-container" class="bg-white rounded-2xl shadow-md p-3 md:p-4 border border-slate-200">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                <button onclick="loadPreset(1)" id="preset-btn-1" class="preset-tab flex flex-col items-center p-3 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-indigo-900 font-bold transition">
                    <span class="text-xs text-indigo-500 mb-1">情境 (一)</span>
                    <span class="text-base">得到 +5 分卡</span>
                </button>
                <button onclick="loadPreset(2)" id="preset-btn-2" class="preset-tab flex flex-col items-center p-3 rounded-xl border-2 border-transparent hover:bg-slate-100 text-slate-700 font-bold transition">
                    <span class="text-xs text-slate-400 mb-1">情境 (二)</span>
                    <span class="text-base">失去 +5 分卡</span>
                </button>
                <button onclick="loadPreset(3)" id="preset-btn-3" class="preset-tab flex flex-col items-center p-3 rounded-xl border-2 border-transparent hover:bg-slate-100 text-slate-700 font-bold transition">
                    <span class="text-xs text-slate-400 mb-1">情境 (三)</span>
                    <span class="text-base">得到 -5 分卡</span>
                </button>
                <button onclick="loadPreset(4)" id="preset-btn-4" class="preset-tab flex flex-col items-center p-3 rounded-xl border-2 border-transparent hover:bg-slate-100 text-slate-700 font-bold transition">
                    <span class="text-xs text-slate-400 mb-1">情境 (四)</span>
                    <span class="text-base">失去 -5 分卡</span>
                </button>
            </div>
        </div>

        <!-- ===== 頁籤二：自由實驗室設定控制項 (預設隱藏) ===== -->
        <div id="sandbox-tab-container" class="hidden bg-white rounded-2xl shadow-md p-5 border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center">
                <span class="mr-2">🎛️</span> 自訂情境參數：
            </h2>
            <div class="grid md:grid-cols-3 gap-6">
                <!-- 動作選擇 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">1. 選擇動作：</label>
                    <div class="flex space-x-2">
                        <button id="sb-act-gain" onclick="setSandboxAction('gain')" class="flex-1 py-2.5 rounded-xl font-bold border-2 border-emerald-500 bg-emerald-50 text-emerald-700">
                            得到 (＋)
                        </button>
                        <button id="sb-act-lose" onclick="setSandboxAction('lose')" class="flex-1 py-2.5 rounded-xl font-bold border-2 border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100">
                            失去 (－)
                        </button>
                    </div>
                </div>

                <!-- 卡牌數值 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">2. 每張分卡數值：</label>
                    <div class="flex items-center space-x-2">
                        <input type="number" id="sb-card-val" value="-5" class="w-full text-center py-2 border-2 border-slate-300 rounded-xl font-bold text-lg focus:border-indigo-500 outline-none">
                        <button onclick="updateSandbox()" class="bg-indigo-600 text-white px-4 py-2.5 rounded-xl font-bold hover:bg-indigo-700 whitespace-nowrap">套用</button>
                    </div>
                </div>

                <!-- 卡牌數量 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-2">3. 提供幾張牌 (1~8)：</label>
                    <div class="flex items-center space-x-2">
                        <input type="range" id="sb-card-count" min="1" max="8" value="4" oninput="updateSandbox()" class="w-full accent-indigo-600">
                        <span id="sb-count-num" class="font-bold text-lg text-indigo-600 w-8 text-center">4</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid lg:grid-cols-12 gap-6 items-stretch">
            
            <!-- 左側：點擊卡牌區 (占 7 格) -->
            <div class="lg:col-span-7 bg-white rounded-3xl shadow-lg p-6 flex flex-col justify-between border border-slate-200 relative overflow-hidden">
                <div>
                    <div class="flex justify-between items-center mb-6">
                        <div>
                            <span id="scenario-badge" class="px-3 py-1 rounded-full text-xs font-black uppercase tracking-wider bg-indigo-100 text-indigo-700">情境展示</span>
                            <h2 id="scenario-title" class="text-xl md:text-2xl font-black text-slate-800 mt-1">
                                小明在比賽中失去下列 4 張分卡
                            </h2>
                        </div>
                        <span class="text-xs bg-slate-100 text-slate-500 px-3 py-1.5 rounded-lg font-medium">👇 請點擊牌卡</span>
                    </div>

                    <p class="text-slate-500 text-sm mb-6">點擊任意一張牌即可「選擇/取消」該牌，觀察右側總得分的即時變化：</p>

                    <!-- 卡牌容器 (動態渲染) -->
                    <div id="cards-wrapper" class="flex flex-wrap justify-center items-center gap-3 md:gap-4 my-8 min-h-[160px]">
                        <!-- Cards will be generated here -->
                    </div>
                </div>

                <!-- 快捷按鈕操作區 -->
                <div class="pt-4 border-t border-slate-100 flex flex-wrap justify-between items-center gap-3">
                    <div class="text-sm font-medium text-slate-600">
                        已點選：<span id="selected-count-label" class="text-indigo-600 font-black text-xl">0</span> / <span id="total-count-label" class="font-bold">4</span> 張
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="selectAllCards()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">
                            全選牌卡
                        </button>
                        <button onclick="clearCardSelections()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition">
                            清空重置
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右側：動態結果與乘法算式區 (占 5 格) -->
            <div class="lg:col-span-5 bg-gradient-to-br from-slate-900 to-indigo-950 text-white rounded-3xl shadow-xl p-6 md:p-8 flex flex-col justify-between border border-indigo-900/50 relative">
                
                <div>
                    <!-- 標頭資訊 -->
                    <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
                        <span class="text-indigo-400 font-bold text-sm tracking-wider uppercase flex items-center">
                            <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping mr-2"></span>
                            即時動態計算機
                        </span>
                        <span id="math-rule-tag" class="text-xs bg-indigo-900/80 text-indigo-300 px-2.5 py-1 rounded-md font-mono border border-indigo-700/50">
                            負負得正
                        </span>
                    </div>

                    <!-- 口語化解說文字 -->
                    <div class="space-y-3 mb-8">
                        <div class="text-slate-400 text-sm">當前的牌卡狀態：</div>
                        <div class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/60 text-lg">
                            <span id="desc-action-text" class="text-amber-400 font-bold">失去</span>
                            <span id="desc-count-text" class="text-white font-black text-2xl mx-1">0</span> 張，
                            每張是 <span id="desc-value-text" class="text-rose-400 font-bold">-5</span> 分
                        </div>
                    </div>

                    <!-- 總得分結果顯示框 (核心視覺重點) -->
                    <div class="mb-8">
                        <div class="text-slate-400 text-sm mb-2">總得分變化：</div>
                        <div id="result-box" class="bg-slate-800/90 rounded-2xl p-6 border-2 border-indigo-500/50 flex flex-col items-center justify-center text-center transition-all">
                            <div class="text-slate-400 text-xs mb-1">總分結果為</div>
                            <div id="result-text-display" class="text-3xl md:text-4xl font-black text-emerald-400 pop-effect">
                                增加 0 分
                            </div>
                            <div id="result-num-signed" class="text-sm font-mono text-slate-400 mt-1">
                                ( +0 分 )
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 對應的正負數乘法算式 -->
                <div class="bg-indigo-950/80 rounded-2xl p-4 border border-indigo-800/60">
                    <div class="text-indigo-300 text-xs font-semibold mb-2">對應正負數乘法算式：</div>
                    <div id="formula-display" class="text-2xl md:text-3xl font-black font-mono tracking-wider text-center text-yellow-300">
                        (-0) × (-5) = +0
                    </div>
                    <p id="formula-explanation" class="text-xs text-slate-400 text-center mt-2">
                        「失去」代表負數乘數，「-5分」代表被乘數
                    </p>
                </div>

            </div>

        </div>

    </main>

    <script>
        // 全域狀態管理 (State)
        let currentState = {
            presetId: 4,               // 預設呈現情境 4: 失去 -5 分卡
            action: 'lose',            // 'gain' (+) 或 'lose' (-)
            cardValue: -5,             // 每張卡牌的分數
            totalCards: 4,             // 卡牌總張數
            selectedCards: [false, false, false, false] // 哪些卡牌被選中 (點擊)
        };

        // 預設四大情境資料 (統一使用 5 / -5)
        const presets = {
            1: { name: '情境 (一)', action: 'gain', cardValue: 5, totalCards: 4, title: '小明在比賽中得到下列 4 張 +5 分卡' },
            2: { name: '情境 (二)', action: 'lose', cardValue: 5, totalCards: 4, title: '小明在比賽中失去下列 4 張 +5 分卡' },
            3: { name: '情境 (三)', action: 'gain', cardValue: -5, totalCards: 4, title: '小明在比賽中得到下列 4 張 -5 分卡' },
            4: { name: '情境 (四)', action: 'lose', cardValue: -5, totalCards: 4, title: '小明在比賽中失去下列 4 張 -5 分卡' }
        };

        // 頁面載入完成初始化
        window.onload = function() {
            loadPreset(4); // 預設載入第四題（使用者舉例的情境）
        };

        // 切換主頁籤 (經典 vs 自由實驗室)
        function switchMainTab(mode) {
            const demoTab = document.getElementById('demo-tab-container');
            const sandboxTab = document.getElementById('sandbox-tab-container');
            const btnDemo = document.getElementById('mode-demo-btn');
            const btnSandbox = document.getElementById('mode-sandbox-btn');

            if (mode === 'demo') {
                demoTab.classList.remove('hidden');
                sandboxTab.classList.add('hidden');
                btnDemo.className = "px-4 py-2 rounded-lg font-bold text-sm bg-white text-indigo-700 shadow hover:bg-indigo-50 transition";
                btnSandbox.className = "px-4 py-2 rounded-lg font-bold text-sm bg-indigo-700 text-indigo-100 hover:bg-indigo-800 transition";
            } else {
                demoTab.classList.add('hidden');
                sandboxTab.classList.remove('hidden');
                btnSandbox.className = "px-4 py-2 rounded-lg font-bold text-sm bg-white text-indigo-700 shadow hover:bg-indigo-50 transition";
                btnDemo.className = "px-4 py-2 rounded-lg font-bold text-sm bg-indigo-700 text-indigo-100 hover:bg-indigo-800 transition";
                updateSandbox();
            }
        }

        // 載入預設四大情境
        function loadPreset(id) {
            currentState.presetId = id;
            const p = presets[id];
            currentState.action = p.action;
            currentState.cardValue = p.cardValue;
            currentState.totalCards = p.totalCards;
            currentState.selectedCards = new Array(p.totalCards).fill(false);

            // 更新選單按鈕樣式
            for (let i = 1; i <= 4; i++) {
                const btn = document.getElementById(`preset-btn-${i}`);
                if (i === id) {
                    btn.className = "preset-tab flex flex-col items-center p-3 rounded-xl border-2 border-indigo-500 bg-indigo-50 text-indigo-900 font-bold transition shadow-sm";
                    btn.querySelector('span').className = "text-xs text-indigo-500 mb-1";
                } else {
                    btn.className = "preset-tab flex flex-col items-center p-3 rounded-xl border-2 border-transparent hover:bg-slate-100 text-slate-700 font-bold transition";
                    btn.querySelector('span').className = "text-xs text-slate-400 mb-1";
                }
            }

            document.getElementById('scenario-badge').innerText = p.name;
            document.getElementById('scenario-title').innerText = p.title;

            renderCards();
            updateCalculation();
        }

        // 設定自由實驗室動作
        function setSandboxAction(act) {
            currentState.action = act;
            const btnGain = document.getElementById('sb-act-gain');
            const btnLose = document.getElementById('sb-act-lose');

            if (act === 'gain') {
                btnGain.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-emerald-500 bg-emerald-50 text-emerald-700";
                btnLose.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100";
            } else {
                btnLose.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-rose-500 bg-rose-50 text-rose-700";
                btnGain.className = "flex-1 py-2.5 rounded-xl font-bold border-2 border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100";
            }
            updateSandbox();
        }

        // 更新自由實驗室設定
        function updateSandbox() {
            const valInput = parseInt(document.getElementById('sb-card-val').value) || 0;
            const countInput = parseInt(document.getElementById('sb-card-count').value) || 1;

            document.getElementById('sb-count-num').innerText = countInput;

            currentState.cardValue = valInput;
            currentState.totalCards = countInput;
            currentState.selectedCards = new Array(countInput).fill(false);

            const actionName = currentState.action === 'gain' ? '得到' : '失去';
            const valName = valInput >= 0 ? `+${valInput}` : `${valInput}`;
            document.getElementById('scenario-badge').innerText = '自由實驗室';
            document.getElementById('scenario-title').innerText = `小明在比賽中${actionName}下列 ${countInput} 張 ${valName} 分卡`;

            renderCards();
            updateCalculation();
        }

        // 渲染牌卡 UI
        function renderCards() {
            const wrapper = document.getElementById('cards-wrapper');
            wrapper.innerHTML = '';

            const isNegativeValue = currentState.cardValue < 0;
            const displayVal = currentState.cardValue > 0 ? `+${currentState.cardValue}` : `${currentState.cardValue}`;

            for (let i = 0; i < currentState.totalCards; i++) {
                const isSelected = currentState.selectedCards[i];
                
                const card = document.createElement('div');
                
                // 動態建構卡牌 CSS 樣式
                let cardStyle = "card-item w-20 h-28 md:w-24 md:h-32 rounded-2xl border-4 flex flex-col items-center justify-center font-black text-2xl md:text-3xl shadow-md relative ";
                
                if (isNegativeValue) {
                    // 負數牌風格
                    if (isSelected) {
                        cardStyle += "bg-rose-500 border-rose-600 text-white active-card negative-style";
                    } else {
                        cardStyle += "bg-white border-rose-400 text-rose-600 hover:border-rose-500";
                    }
                } else {
                    // 正數牌風格
                    if (isSelected) {
                        cardStyle += "bg-blue-600 border-blue-700 text-white active-card";
                    } else {
                        cardStyle += "bg-white border-blue-400 text-blue-600 hover:border-blue-500";
                    }
                }

                card.className = cardStyle;
                
                // 卡牌內部 HTML (含勾選提示)
                card.innerHTML = `
                    <span>${displayVal}</span>
                    ${isSelected ? '<span class="absolute top-1 right-2 text-xs opacity-80">✓</span>' : ''}
                `;

                // 綁定點擊事件 (Toggle 狀態)
                card.onclick = function() {
                    currentState.selectedCards[i] = !currentState.selectedCards[i];
                    renderCards();
                    updateCalculation();
                };

                wrapper.appendChild(card);
            }

            document.getElementById('total-count-label').innerText = currentState.totalCards;
        }

        // 核心動態運算與 UI 更新
        function updateCalculation() {
            // 計算選中的牌張數
            const selectedCount = currentState.selectedCards.filter(Boolean).length;
            document.getElementById('selected-count-label').innerText = selectedCount;

            // 1. 動作正負倍數: 得到 = +1, 失去 = -1
            const actionMultiplier = currentState.action === 'gain' ? 1 : -1;
            
            // 2. 算式中的乘數: selectedCount * actionMultiplier
            // 例如: 失去 2 張 -> 乘數為 -2
            const multiplierVal = selectedCount * actionMultiplier;
            
            // 3. 最終結果 = 乘數 * 卡牌數值
            const totalScoreChange = multiplierVal * currentState.cardValue;

            // ===== 右側 UI 動態更新 =====
            
            // 更新文字敘述
            const actionText = currentState.action === 'gain' ? '得到' : '失去';
            document.getElementById('desc-action-text').innerText = actionText;
            document.getElementById('desc-action-text').className = currentState.action === 'gain' ? 'text-emerald-400 font-bold' : 'text-amber-400 font-bold';
            
            document.getElementById('desc-count-text').innerText = selectedCount;
            
            const valDisplay = currentState.cardValue > 0 ? `+${currentState.cardValue}` : `${currentState.cardValue}`;
            document.getElementById('desc-value-text').innerText = valDisplay;
            document.getElementById('desc-value-text').className = currentState.cardValue >= 0 ? 'text-blue-400 font-bold' : 'text-rose-400 font-bold';

            // 更新總得分變化顯示區
            const resultBox = document.getElementById('result-box');
            const resultTextDisplay = document.getElementById('result-text-display');
            const resultNumSigned = document.getElementById('result-num-signed');

            let resultWord = "";
            let signedString = "";

            if (totalScoreChange > 0) {
                resultWord = `增加 ${totalScoreChange} 分`;
                signedString = `( +${totalScoreChange} 分 )`;
                resultTextDisplay.className = "text-3xl md:text-4xl font-black text-emerald-400 pop-effect";
                resultBox.className = "bg-slate-800/90 rounded-2xl p-6 border-2 border-emerald-500/80 positive-glow flex flex-col items-center justify-center text-center transition-all";
            } else if (totalScoreChange < 0) {
                resultWord = `減少 ${Math.abs(totalScoreChange)} 分`;
                signedString = `( ${totalScoreChange} 分 )`;
                resultTextDisplay.className = "text-3xl md:text-4xl font-black text-rose-400 pop-effect";
                resultBox.className = "bg-slate-800/90 rounded-2xl p-6 border-2 border-rose-500/80 flex flex-col items-center justify-center text-center transition-all";
            } else {
                resultWord = `不變 ( 0 分 )`;
                signedString = `( 0 分 )`;
                resultTextDisplay.className = "text-3xl md:text-4xl font-black text-slate-300 pop-effect";
                resultBox.className = "bg-slate-800/90 rounded-2xl p-6 border-2 border-slate-700 flex flex-col items-center justify-center text-center transition-all";
            }

            resultTextDisplay.innerText = resultWord;
            resultNumSigned.innerText = signedString;

            // 觸發重新動畫
            resultTextDisplay.classList.remove('pop-effect');
            void resultTextDisplay.offsetWidth; // 觸發 Reflow
            resultTextDisplay.classList.add('pop-effect');

            // ===== 數學算式與法則標籤更新 =====
            const multStr = multiplierVal >= 0 ? `(+${multiplierVal})` : `(${multiplierVal})`;
            const cardValStr = currentState.cardValue >= 0 ? `(+${currentState.cardValue})` : `(${currentState.cardValue})`;
            const totalStr = totalScoreChange >= 0 ? `+${totalScoreChange}` : `${totalScoreChange}`;

            document.getElementById('formula-display').innerText = `${multStr} × ${cardValStr} = ${totalStr}`;

            // 口訣提示
            const ruleTag = document.getElementById('math-rule-tag');
            const explanation = document.getElementById('formula-explanation');

            if (multiplierVal >= 0 && currentState.cardValue >= 0) {
                ruleTag.innerText = "正正得正";
                explanation.innerText = "「得到」(+) 正分牌 (+) ➔ 總分增加 (+)";
            } else if (multiplierVal < 0 && currentState.cardValue >= 0) {
                ruleTag.innerText = "負正得負";
                explanation.innerText = "「失去」(-) 正分牌 (+) ➔ 總分減少 (-)";
            } else if (multiplierVal >= 0 && currentState.cardValue < 0) {
                ruleTag.innerText = "正負得負";
                explanation.innerText = "「得到」(+) 負分牌 (-) ➔ 總分減少 (-)";
            } else {
                ruleTag.innerText = "負負得正";
                explanation.innerText = "💡 關鍵概念：「失去」(-) 負分牌 (-) ➔ 相當於總分「增加」(＋)！";
            }
        }

        // 一鍵全選
        function selectAllCards() {
            currentState.selectedCards = new Array(currentState.totalCards).fill(true);
            renderCards();
            updateCalculation();
        }

        // 清空選擇
        function clearCardSelections() {
            currentState.selectedCards = new Array(currentState.totalCards).fill(false);
            renderCards();
            updateCalculation();
        }
    </script>
</body>
</html>
